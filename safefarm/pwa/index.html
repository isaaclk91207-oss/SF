<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4CAF50">
  <meta name="description" content="SafeFarm Myanmar - Flood Damage Assessment for Myanmar Agriculture">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SafeFarm">
  
  <title>SafeFarm Myanmar</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #f5f5f5;
      overflow: hidden;
    }
    
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #4CAF50 0%, #2196F3 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    
    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .loading-icon {
      font-size: 64px;
      margin-bottom: 20px;
      animation: pulse 1.5s infinite;
    }
    
    .loading-text {
      color: white;
      font-size: 24px;
      font-weight: 500;
      margin-bottom: 10px;
    }
    
    .loading-subtext {
      color: rgba(255,255,255,0.8);
      font-size: 14px;
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-top: 20px;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    #app-frame {
      width: 100%;
      height: 100vh;
      border: none;
      display: none;
    }
    
    #server-status {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      z-index: 1000;
      display: none;
    }
    
    #server-status.online {
      background: #4CAF50;
      color: white;
    }
    
    #server-status.offline {
      background: #f44336;
      color: white;
    }
    
    #install-prompt {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      padding: 15px 25px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      display: none;
      z-index: 1001;
      text-align: center;
      max-width: 90%;
    }
    
    #install-prompt button {
      margin: 5px;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    
    #install-prompt .install-btn {
      background: #4CAF50;
      color: white;
    }
    
    #install-prompt .dismiss-btn {
      background: #eee;
      color: #333;
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loading-icon">🌾</div>
    <div class="loading-text">SafeFarm Myanmar</div>
    <div class="loading-subtext">Connecting to server...</div>
    <div class="loading-spinner"></div>
  </div>
  
  <!-- Streamlit App Frame -->
  <iframe id="app-frame" title="SafeFarm Myanmar"></iframe>
  
  <!-- Server Status Indicator -->
  <div id="server-status"></div>
  
  <!-- Install Prompt -->
  <div id="install-prompt">
    <p style="margin-bottom: 10px; font-weight: 500;">Install SafeFarm Myanmar?</p>
    <p style="font-size: 12px; color: #666; margin-bottom: 15px;">Add to your home screen for quick access</p>
    <button class="install-btn" id="install-btn">Install</button>
    <button class="dismiss-btn" id="dismiss-btn">Later</button>
  </div>

  <script>
    const STREAMLIT_URL = 'http://localhost:8501';
    const loadingScreen = document.getElementById('loading-screen');
    const appFrame = document.getElementById('app-frame');
    const serverStatus = document.getElementById('server-status');
    const installPrompt = document.getElementById('install-prompt');
    const installBtn = document.getElementById('install-btn');
    const dismissBtn = document.getElementById('dismiss-btn');
    
    let deferredPrompt = null;
    let serverCheckInterval = null;
    
    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => {
          console.log('Service Worker registered:', reg.scope);
        })
        .catch((err) => {
          console.error('Service Worker registration failed:', err);
        });
    }
    
    // Handle install prompt
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installPrompt.style.display = 'block';
    });
    
    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log('Install outcome:', outcome);
        deferredPrompt = null;
        installPrompt.style.display = 'none';
      }
    });
    
    dismissBtn.addEventListener('click', () => {
      installPrompt.style.display = 'none';
    });
    
    // Check if Streamlit server is running
    async function checkServer() {
      try {
        const response = await fetch(STREAMLIT_URL, { 
          mode: 'no-cors',
          signal: AbortSignal.timeout(3000)
        });
        return true;
      } catch (error) {
        return false;
      }
    }
    
    // Update server status display
    function updateServerStatus(isOnline) {
      if (isOnline) {
        serverStatus.textContent = 'Server Online';
        serverStatus.className = 'online';
        serverStatus.style.display = 'block';
        setTimeout(() => {
          serverStatus.style.display = 'none';
        }, 3000);
      } else {
        serverStatus.textContent = 'Server Offline - Run start.bat';
        serverStatus.className = 'offline';
        serverStatus.style.display = 'block';
      }
    }
    
    // Connect to Streamlit server
    async function connectToServer() {
      const isOnline = await checkServer();
      
      if (isOnline) {
        loadingScreen.classList.add('hidden');
        appFrame.src = STREAMLIT_URL;
        appFrame.style.display = 'block';
        updateServerStatus(true);
        
        // Start checking server status periodically
        serverCheckInterval = setInterval(async () => {
          const stillOnline = await checkServer();
          if (!stillOnline) {
            updateServerStatus(false);
            // Show offline page after a delay
            setTimeout(() => {
              window.location.href = './offline.html';
            }, 5000);
          }
        }, 10000);
      } else {
        // Retry connection
        setTimeout(connectToServer, 2000);
      }
    }
    
    // Start connection
    connectToServer();
    
    // Handle visibility change (when user returns to tab)
    document.addEventListener('visibilitychange', async () => {
      if (!document.hidden) {
        const isOnline = await checkServer();
        if (!isOnline) {
          updateServerStatus(false);
        }
      }
    });
  </script>
</body>
</html>
